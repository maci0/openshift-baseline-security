# Derived from ubi9/nginx-120 defaults: root /opt/app-root/src, no plaintext 8080.
# Writable paths live under /tmp so the container can use a read-only rootfs
# (emptyDir mount). Logs go to the container stream, not on-disk files.
worker_processes auto;
error_log /dev/stderr;
pid /tmp/nginx.pid;
# Bound the graceful shutdown. The image's STOPSIGNAL is SIGQUIT, so on
# termination nginx stops accepting, closes keepalives, and waits for in-flight
# requests to finish; with no bound a worker held by a slow client runs until
# the kubelet SIGKILLs it, cutting the response instead of ending it. 20s fits
# the pod's window: terminationGracePeriodSeconds 30 minus the 5s preStop sleep
# (operator/internal/controller/plugin_pod.go), leaving 5s of margin for the
# exit itself.
worker_shutdown_timeout 20s;

include /usr/share/nginx/modules/*.conf;

events {
    worker_connections 1024;
}

http {
    # Log only non-2xx/3xx: console proxy can hit many static assets per page;
    # success lines bury real 4xx/5xx and inflate log volume for no signal.
    map $status $loggable {
        ~^[23]  0;
        default 1;
    }
    # Content-hashed chunks are immutable; everything else (plugin-manifest.json,
    # locales) must revalidate every fetch. Without an explicit Cache-Control the
    # browser applies heuristic freshness from Last-Modified (image build time),
    # so after an upgrade a cached stale manifest requests old hashed chunks the
    # new pod no longer has and the plugin fails to load until a hard refresh.
    map $uri $asset_cache {
        ~\.js$  "public, max-age=31536000, immutable";
        default "no-cache";
    }
    # combined carries $remote_addr (the admin's client IP), $http_referer
    # (the full console URL) and $http_user_agent. All three are personal data
    # and none of them triages a 4xx/5xx on a static-asset server: the log line
    # is collected verbatim into must-gather's console-plugin.log and from there
    # into support archives, which is a copy an operator can no longer redact.
    # $uri drops any query string for the same reason (console URLs carry tab and
    # filter state); what remains is the request shape the error triage needs.
    log_format pii_safe '$request_method $uri $server_protocol $status $body_bytes_sent';
    # The format name must be declared before the access_log that uses it, else
    # nginx parses "if=$loggable" as part of the format name and fails to start.
    access_log /dev/stdout pii_safe if=$loggable;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 4096;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    # Temp paths must be under the writable emptyDir when root is read-only.
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp 1 2;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    # Do not include /opt/app-root/etc/nginx.d/*.conf: the UBI S2I snippets may
    # start a plaintext 8080 server beside this TLS-only listener.

    server {
        # http2: ALPN still accepts HTTP/1.1. Manifest, hashed chunks, and
        # locale JSON multiplex on one connection instead of six sequential
        # GETs under HTTP/1.1 (the console proxy and direct hits both speak TLS).
        listen 9443 ssl http2;
        listen [::]:9443 ssl http2;
        server_name _;
        root /opt/app-root/src;

        ssl_certificate /var/serving-cert/tls.crt;
        ssl_certificate_key /var/serving-cert/tls.key;
        ssl_session_cache shared:SSL:1m;
        ssl_session_timeout 10m;
        # Session tickets reuse a long-lived key; disable for forward secrecy.
        ssl_session_tickets off;
        # Pin the floor explicitly; do not rely on the base image default.
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers PROFILE=SYSTEM;
        ssl_prefer_server_ciphers on;

        # Static plugin assets only: reject uploads / large bodies so a client
        # cannot fill the writable emptyDir client_body_temp path.
        client_max_body_size 1k;
        autoindex off;

        # Serve plugin assets with their declared type only; block MIME sniffing.
        add_header X-Content-Type-Options nosniff always;
        # Assets are never framed; console loads them as module federation JS.
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        # HTTPS-only server (9443); pin HSTS for direct hits (console proxy has its own).
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        # Static assets only: no document execution surface if the URL is opened
        # directly. Module federation executes under the console document CSP.
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;
        # Direct hits only (console proxies plugin assets under its own origin).
        # Keep embedding and window.opener isolation if the service URL is opened.
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        # Same level as the security headers on purpose: a nested add_header
        # inside location{} would cancel every inherited add_header above.
        # No 'always': a mid-rollout 404 for a new hashed chunk must not be
        # cached immutably for a year (404s carry no Last-Modified, so without
        # the header they get no heuristic caching either).
        add_header Cache-Control $asset_cache;

        location = /healthz {
            # Constant return, no asset access. Liveness probes this: the asset
            # tree is baked into the image under a read-only rootfs, so nothing
            # a probe can observe about it changes by restarting the container,
            # and a failing liveness would only turn a broken image into a
            # restart loop. Readiness probes /readyz, which does check the tree.
            # Server-level add_header is cancelled inside a location block, and
            # a bare 200 to kubelet carries no headers worth re-listing beyond
            # keeping the browser from sniffing it.
            add_header X-Content-Type-Options nosniff always;
            default_type text/plain;
            return 200 "ok\n";
        }

        location = /readyz {
            # Readiness asks the one question the plugin exists to answer: can
            # this worker actually read the asset tree. A truncated image, or a
            # root the non-root nginx cannot traverse, serves 404 for every
            # asset while the listener stays open, and a constant 200 would keep
            # the pod in the Service drawing console traffic. -r is access(2) on
            # the root, not a file read, so it costs one syscall per probe and
            # fails closed exactly on the unreadable-root case.
            if (!-r /opt/app-root/src) {
                return 503 "asset root not readable\n";
            }
            add_header X-Content-Type-Options nosniff always;
            default_type text/plain;
            return 200 "ok\n";
        }

        location / {
            # GET/HEAD only; POST/PUT/etc. would still hit client_body_temp.
            limit_except GET HEAD {
                deny all;
            }
            try_files $uri =404;
        }

        # JS/JSON only (no images/fonts in this tree).
        # gzip_vary: caches must key on Accept-Encoding or a gzip body can
        # be served to a client that cannot decode it.
        # Level 9, not a cheap one: every .js here is content-hashed and served
        # immutable for a year, so the bytes are produced once at image build
        # and each client compresses them at most once per plugin version. The
        # extra CPU is paid on a cache miss; the bytes it saves are paid on
        # every cold fill. This is also the level `yarn size` and the CI size
        # step measure at, so the budget number is the number on the wire.
        # Precompressed .gz files plus gzip_static would remove the per-miss
        # CPU entirely, but the UBI module set has no gzip_static. Brotli and
        # zstd are not offered either: both are extra module builds, an
        # unknown directive stops nginx from starting, and the module set
        # cannot be probed from the build. gzip stays the served encoding and
        # the level is the lever that remains.
        gzip on;
        gzip_vary on;
        gzip_comp_level 9;
        gzip_min_length 256;
        gzip_types
            application/javascript
            application/json
            application/xml
            text/css
            text/javascript
            text/plain
            application/x-javascript;
    }
}
