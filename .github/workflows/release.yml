name: release

# Publish the operator, console-plugin, OLM bundle, and catalog images to
# quay.io on a version tag. The CSV/Makefile already reference
# quay.io/openshift-baseline-security/*, so a tag push is all it takes to make
# an OLM-installable release the community can pull. amd64 only for now
# (OpenShift's primary arch); add QEMU + buildx platforms when arm64 is needed.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Cut version matching Makefile VERSION and git tag vX.Y.Z (MAJOR.MINOR.PATCH; a leading v is accepted. Not a re-tag of a published cut)'
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      REGISTRY: quay.io/openshift-baseline-security
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-tags: true

      # The release gate runs go vet and go test, so build with the toolchain
      # go.mod pins rather than whatever the runner image happens to ship.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: operator/go.mod
          cache-dependency-path: operator/go.sum

      # Version from the tag (strip leading v) or the manual input; must match
      # the Makefile VERSION so a release never ships images tagged differently
      # from the CSV's own image references. Refuse a cut whose git tag is
      # missing, a different commit than HEAD, or whose CHANGELOG still has
      # Unreleased bullets (would publish unreleased work as :VERSION).
      # The same script gates the sbom job, so the two cannot drift apart.
      - name: resolve and verify version
        # inputs.version is empty on a tag push (the ref name carries the version)
        # and authoritative on a dispatch, so a hand-typed cut cannot be silently
        # replaced by the ref it was dispatched from.
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          operator/hack/resolve-release-version.sh
          make -C operator RELEASE_GATE=1 REQUIRE_GIT_TAGS=1 verify-versions

      # Its own step because VERSION only becomes an environment variable once
      # the step above has written it to GITHUB_ENV; within a single step the
      # export is not visible to the shell that asked for it.
      #
      # Classic docker driver (build then push, image lands in the local store),
      # so the buildx-only --provenance/--sbom are dropped from the Makefile
      # default: the release does not need reproducible-digest parity with the
      # CI images job. ?= in both Makefiles defers to this exported value.
      # --build-arg VERSION is what makes org.opencontainers.image.version say
      # what is being published rather than each Dockerfile's ARG default.
      - name: export image build flags
        run: |
          set -euo pipefail
          echo "DOCKER_BUILD_FLAGS=--pull --build-arg SOURCE_DATE_EPOCH=0 --build-arg VERSION=$VERSION" >> "$GITHUB_ENV"

      # Publishing is gated on the tagged commit's own tests, not only on
      # whatever CI run happened to be green when the tag was cut.
      - name: test the tagged commit
        run: make -C operator test

      # The plugin image is built from the same commit, so it gets the same
      # gate; typecheck is included because jest cannot type a webpack build.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: console-plugin/package.json
      # bun's global install cache, keyed on the lockfile, as in ci.yml: the
      # tagged commit's install graph is the same one CI warmed that week.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-cache-${{ runner.os }}-${{ hashFiles('console-plugin/bun.lock') }}
          restore-keys: |
            bun-cache-${{ runner.os }}-
      - name: test the tagged commit (console plugin)
        working-directory: console-plugin
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bun run typecheck
          bun run test

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_TOKEN }}

      # The project never re-pushes a published tag, so a re-run of this
      # workflow must not overwrite one. quay does not enforce tag immutability
      # here, and `docker push` would silently replace the manifest that
      # consumers already resolved. Refuse before the (slow) builds if any
      # :VERSION tag already exists. --output json keeps the check quiet on
      # success; a non-zero exit is the only thing that matters.
      - name: refuse to overwrite a published tag
        run: |
          set -euo pipefail
          for name in \
            baseline-security-operator \
            baseline-security-console-plugin \
            baseline-security-operator-bundle \
            baseline-security-operator-catalog; do
            img="$REGISTRY/$name:$VERSION"
            if docker manifest inspect "$img" >/dev/null 2>&1; then
              echo "$img is already published; a published tag is immutable." >&2
              echo "Cut a new version instead of re-publishing $VERSION." >&2
              exit 1
            fi
          done

      # A published tag is immutable and this project never re-pushes one, so a
      # release must be all-or-nothing: every image is built and verified before
      # the first push. Building and pushing per image (build, push, build,
      # push) meant a failure in a later build left earlier :VERSION tags
      # already on quay with no operator/CSV counterpart, and the documented
      # remedy for that state is a new version, not a retry. Verification is the
      # same gate as before (root USER, version, source, license labels), just
      # run once per image against the local store.
      - name: operator image
        run: |
          set -euo pipefail
          img="$REGISTRY/baseline-security-operator:$VERSION"
          make -C operator docker-build IMG="$img"
          operator/hack/verify-image-metadata.sh "$img"

      - name: console-plugin image
        run: |
          set -euo pipefail
          img="$REGISTRY/baseline-security-console-plugin:$VERSION"
          # The Makefile target, not a hand-rolled `docker build`: it is the one
          # place the plugin image flags live, and it refuses an empty VERSION
          # before the (slow) build starts.
          make -C console-plugin docker-build IMG="$img"
          operator/hack/verify-image-metadata.sh "$img"

      - name: bundle image
        run: |
          set -euo pipefail
          img="$REGISTRY/baseline-security-operator-bundle:$VERSION"
          make -C operator bundle-build BUNDLE_IMG="$img"
          # FROM scratch: OLM unpacks it, so no USER is required (but no root either).
          operator/hack/verify-image-metadata.sh "$img" --allow-scratch-user

      # The catalog references the bundle pullspec, so it builds last.
      - name: catalog image
        run: |
          set -euo pipefail
          img="$REGISTRY/baseline-security-operator-catalog:$VERSION"
          make -C operator catalog-build \
            BUNDLE_IMG="$REGISTRY/baseline-security-operator-bundle:$VERSION" \
            CATALOG_IMG="$img"
          operator/hack/verify-image-metadata.sh "$img"

      # Everything above built and verified; publish. Two phases so a consumer
      # pulling :latest never sees a mixture of two versions: every immutable
      # :VERSION tag (the one the CSV pins) lands first, then the convenience
      # pointers move together.
      - name: push versioned images
        run: |
          set -euo pipefail
          for name in \
            baseline-security-operator \
            baseline-security-console-plugin \
            baseline-security-operator-bundle \
            baseline-security-operator-catalog; do
            docker push "$REGISTRY/$name:$VERSION"
          done

      - name: push latest pointers
        run: |
          set -euo pipefail
          for name in \
            baseline-security-operator \
            baseline-security-console-plugin \
            baseline-security-operator-bundle \
            baseline-security-operator-catalog; do
            img="$REGISTRY/$name:$VERSION"
            docker tag "$img" "$REGISTRY/$name:latest"
            docker push "$REGISTRY/$name:latest"
          done

  # CycloneDX SBOM for every pushed image, attached to the GitHub release so
  # consumers and vuln scanners have an inventory of what shipped. Kept out of
  # the publish job so image digests stay untouched (matches ci.yml's
  # --provenance=false --sbom=false reproducibility stance).
  sbom:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [publish]
    # contents:write is only for attaching SBOM files to the existing release;
    # checkout runs with persist-credentials:false so no token lands on disk.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The script proves the tag exists and points at HEAD; SBOMs must
          # describe the same commit the publish job pushed.
          fetch-tags: true

      - name: resolve and verify version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: operator/hack/resolve-release-version.sh

      - name: SBOM operator image
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: quay.io/openshift-baseline-security/baseline-security-operator:${{ env.VERSION }}
          format: cyclonedx-json
          artifact-name: baseline-security-operator-${{ env.VERSION }}-sbom.cdx.json
          upload-artifact: true
          upload-release-assets: false

      - name: SBOM console-plugin image
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: quay.io/openshift-baseline-security/baseline-security-console-plugin:${{ env.VERSION }}
          format: cyclonedx-json
          artifact-name: baseline-security-console-plugin-${{ env.VERSION }}-sbom.cdx.json
          upload-artifact: true
          upload-release-assets: false

      - name: SBOM bundle image
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: quay.io/openshift-baseline-security/baseline-security-operator-bundle:${{ env.VERSION }}
          format: cyclonedx-json
          artifact-name: baseline-security-operator-bundle-${{ env.VERSION }}-sbom.cdx.json
          upload-artifact: true
          upload-release-assets: false

      - name: SBOM catalog image
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: quay.io/openshift-baseline-security/baseline-security-operator-catalog:${{ env.VERSION }}
          format: cyclonedx-json
          artifact-name: baseline-security-operator-catalog-${{ env.VERSION }}-sbom.cdx.json
          upload-artifact: true
          upload-release-assets: false

      # Attach to the release when one exists (tag push); a dispatch from that
      # tagged commit without a GitHub release keeps SBOMs as workflow artifacts
      # instead of failing the job.
      - name: attach SBOMs to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --json id >/dev/null 2>&1; then
            gh release upload "$TAG" \
              "baseline-security-operator-$VERSION-sbom.cdx.json" \
              "baseline-security-console-plugin-$VERSION-sbom.cdx.json" \
              "baseline-security-operator-bundle-$VERSION-sbom.cdx.json" \
              "baseline-security-operator-catalog-$VERSION-sbom.cdx.json" \
              --clobber
          else
            echo "no GitHub release for $TAG; SBOMs remain as workflow artifacts" >&2
          fi
