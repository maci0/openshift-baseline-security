# Identity and discovery RBAC for the platform Prometheus scrape. The
# ServiceMonitor in servicemonitor.yaml names the Secret below for its bearer
# token, so these objects must land in the same install as it.
#
# Cluster monitoring denies on-disk credentials (bearerTokenFile / caFile), so
# the scrape token comes from a Secret bound to a dedicated scraper
# ServiceAccount that holds the baseline-security-metrics-reader ClusterRole
# (config/rbac/metrics_reader_role.yaml).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: baseline-security-metrics-scraper
  namespace: openshift-baseline-security
---
apiVersion: v1
kind: Secret
metadata:
  name: baseline-security-metrics-scraper-token
  namespace: openshift-baseline-security
  annotations:
    kubernetes.io/service-account.name: baseline-security-metrics-scraper
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: baseline-security-metrics-scraper
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: baseline-security-metrics-reader
subjects:
  - kind: ServiceAccount
    name: baseline-security-metrics-scraper
    namespace: openshift-baseline-security
---
# Platform Prometheus discovers scrape targets by listing Services/Endpoints/Pods
# in this namespace. The openshift.io/cluster-monitoring label adds the namespace
# to Prometheus's ServiceMonitor selector, but the cluster-monitoring operator
# only auto-grants this service-discovery read access to namespaces it manages,
# not arbitrary labeled ones. Without this Role/RoleBinding the prometheus-k8s
# ServiceAccount gets 403 on endpoints, discovery finds zero targets, and no
# metrics are ever scraped (ComplianceStatusStale fires). Mirrors the Role CMO
# creates for platform namespaces (openshift-apiserver, etc.).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: prometheus-k8s
  namespace: openshift-baseline-security
  labels:
    app: baseline-security-operator
rules:
  - apiGroups: [""]
    resources: [services, endpoints, pods]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: prometheus-k8s
  namespace: openshift-baseline-security
  labels:
    app: baseline-security-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: prometheus-k8s
subjects:
  - kind: ServiceAccount
    name: prometheus-k8s
    namespace: openshift-monitoring
