apiVersion: v1
kind: Namespace
metadata:
  name: openshift-baseline-security
  labels:
    # openshift-* namespaces are platform-reserved: user-workload monitoring
    # never scrapes them. Without this label the platform Prometheus also skips
    # the namespace, so the ServiceMonitor/PrometheusRule ship dead (no targets,
    # no alerts). The label opts the namespace into cluster (platform) monitoring.
    openshift.io/cluster-monitoring: "true"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: baseline-security-operator
  namespace: openshift-baseline-security
  labels:
    app: baseline-security-operator
    # Recommended labels: a NetworkPolicy, HPA or backup tool that selects on
    # app.kubernetes.io/* matches nothing without them. `app` stays the only
    # selector key (the Deployment selector is immutable).
    app.kubernetes.io/name: baseline-security-operator
    app.kubernetes.io/component: controller
    app.kubernetes.io/part-of: baseline-security
    app.kubernetes.io/managed-by: olm
spec:
  # Two replicas for fast failover; correctness is from leader election. No
  # PodDisruptionBudget on purpose (ADR-028): a static PDB deadlocks a node
  # drain on single-node OpenShift, and no fixed-replica PDB value avoids it.
  replicas: 2
  # Keep one ready replica during rollout (matches 2-replica HA + anti-affinity).
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app: baseline-security-operator
  template:
    metadata:
      labels:
        app: baseline-security-operator
        app.kubernetes.io/name: baseline-security-operator
        app.kubernetes.io/component: controller
        app.kubernetes.io/part-of: baseline-security
        app.kubernetes.io/managed-by: olm
    spec:
      serviceAccountName: baseline-security-operator
      # Avoid injecting KUBERNETES_* service env for every Service in the NS.
      enableServiceLinks: false
      # Explicit drain window (kube default is 30s); matches plugin pods so
      # leader election and nginx can finish in-flight work on SIGTERM.
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: baseline-security-operator
                topologyKey: kubernetes.io/hostname
      containers:
        # :latest is the local kustomize default. `make deploy IMG=... PLUGIN_IMG=...`
        # rewrites both refs before apply. OLM installs use versioned CSV tags.
        - name: manager
          image: quay.io/openshift-baseline-security/baseline-security-operator:latest
          # Base uses :latest; Always avoids a stale local digest after rebuild.
          # make deploy with a versioned/digest ref still works (re-pull is fine).
          imagePullPolicy: Always
          args:
            - --leader-elect
            - --metrics-bind-address=:8443
            - --metrics-secure=true
            - --metrics-cert-dir=/var/run/metrics-certs
            # Must match liveness/readiness probe ports below (not only flag default).
            - --health-probe-bind-address=:8081
          env:
            # Soft heap target below the memory limit so Go's GC becomes
            # container-aware and collects harder as the informer cache of
            # ComplianceCheckResults/Remediations grows on a large cluster,
            # instead of letting a transient allocation spike breach the cgroup
            # cap and OOMKill. Keep ~85% of limits.memory (512Mi -> 440MiB).
            - name: GOMEMLIMIT
              value: 440MiB
            # Image the operator deploys for the console plugin. OLM maps
            # relatedImages; make deploy rewrites this from PLUGIN_IMG.
            - name: RELATED_IMAGE_CONSOLE_PLUGIN
              value: quay.io/openshift-baseline-security/baseline-security-console-plugin:latest
            # Optional: set to "true" (also 1/yes/on/y/t/enable/enabled) to
            # skip creating ClusterBaseline/cluster when none exist. The
            # matching false spellings (false/0/no/off/n/f/disable/disabled)
            # are the same as unset. Any other value fails process start.
            # Must match envSkipDefaultCR in cmd/main.go
            # (BASELINE_SECURITY_SKIP_DEFAULT_CR).
            # - name: BASELINE_SECURITY_SKIP_DEFAULT_CR
            #   value: "true"
          ports:
            - name: https-metrics
              containerPort: 8443
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            # Explicit false: do not rely on API default if a mutating webhook
            # or prior hand-edit left Privileged set before this container replace.
            privileged: false
            capabilities:
              drop: ["ALL"]
            # Container-level RuntimeDefault so Restricted PSS / audits that only
            # inspect container SC still see seccomp (pod SC already sets it).
            seccompProfile:
              type: RuntimeDefault
            readOnlyRootFilesystem: true
            runAsNonRoot: true
          volumeMounts:
            - name: metrics-certs
              mountPath: /var/run/metrics-certs
              readOnly: true
            # Writable scratch for GO/runtime temp with read-only rootfs.
            - name: tmp
              mountPath: /tmp
          # Allow slow cold start (CRDs, leader election, image pull lag) without
          # liveness killing the process. failureThreshold*periodSeconds = 5m.
          startupProbe:
            httpGet:
              path: /healthz
              port: 8081
            periodSeconds: 10
            timeoutSeconds: 1
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            # startupProbe owns the initial window; keep a short period once live.
            timeoutSeconds: 1
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            # After startup succeeds, fail closed quickly if the process stalls.
            timeoutSeconds: 1
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 500m
              # Headroom for the full-body informer cache of CCRs/Remediations on
              # a large cluster; paired with GOMEMLIMIT=440MiB above.
              memory: 512Mi
          lifecycle:
            preStop:
              # Kube removes the endpoint only after SIGTERM, so a pod can
              # still be scraped (and can still hold the leader lease) in the
              # first seconds of termination. The sleep lets the endpoint leave
              # the Service before the process sees SIGTERM; 5s is well inside
              # terminationGracePeriodSeconds (30) minus the 20s
              # GracefulShutdownTimeout in cmd/main.go.
              #
              # Native sleep handler, not exec: the runtime image is ubi-micro,
              # which ships no shell and no coreutils, so `/bin/sh -c "sleep 5"`
              # cannot run in the container and the hook would fail without ever
              # opening the drain window. The kubelet sleeps on the pod's behalf
              # (Kubernetes 1.29+; the CSV's minKubeVersion is 1.35).
              sleep:
                seconds: 5
          # Prefer logs when the process dies before writing /dev/termination-log.
          terminationMessagePolicy: FallbackToLogsOnError
      volumes:
        - name: metrics-certs
          secret:
            secretName: baseline-security-operator-metrics-cert
            optional: true
            # The manager runs as 65532:65532 (image USER) and the kubelet
            # projects secret files root-owned, so a root-only mode makes the
            # service-ca cert permanently unreadable: the metrics server falls
            # back to its self-signed pair and the service-ca-annotated
            # Service can no longer be verified by the metrics stack.
            defaultMode: 0644
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
