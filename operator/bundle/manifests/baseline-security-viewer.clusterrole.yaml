# Human-facing ClusterRoles. Viewer aggregates into the built-in view and
# cluster-reader roles so console users can see results without extra
# bindings. Admin is not aggregated onto the built-in admin ClusterRole: a
# RoleBinding to admin in openshift-compliance would otherwise grant
# namespaced patch on ComplianceRemediations (node reboots) without
# cluster-scoped ClusterBaseline access. Bind baseline-security-admin
# explicitly, or use cluster-admin (which already includes these verbs).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: baseline-security-viewer
  labels:
    rbac.authorization.k8s.io/aggregate-to-view: "true"
    rbac.authorization.k8s.io/aggregate-to-cluster-reader: "true"
rules:
  - apiGroups: [baselinesecurity.openshift.io]
    resources: [clusterbaselines]
    verbs: [get, list, watch]
  - apiGroups: [compliance.openshift.io]
    resources:
      - compliancecheckresults
      - compliancescans
      - compliancesuites
      - complianceremediations
      - profiles
      - tailoredprofiles
      - rules
    verbs: [get, list, watch]
