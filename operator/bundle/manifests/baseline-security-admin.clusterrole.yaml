apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: baseline-security-admin
rules:
  # Read: superset of baseline-security-viewer so a ClusterRoleBinding to
  # this role alone is enough to use the console, not only to write.
  - apiGroups: [baselinesecurity.openshift.io]
    resources: [clusterbaselines]
    verbs: [get, list, watch]
  - apiGroups: [compliance.openshift.io]
    resources:
      - compliancecheckresults
      - compliancescans
      - compliancesuites
      - complianceremediations
      - profiles
      - tailoredprofiles
      - rules
    verbs: [get, list, watch]
  - apiGroups: [baselinesecurity.openshift.io]
    resources: [clusterbaselines]
    resourceNames: [cluster]
    verbs: [update, patch]
  - apiGroups: [compliance.openshift.io]
    resources: [compliancescans]
    verbs: [patch]
  - apiGroups: [compliance.openshift.io]
    resources: [complianceremediations]
    verbs: [get, list, watch, update, patch]
  - apiGroups: [compliance.openshift.io]
    resources: [tailoredprofiles]
    verbs: [get, list, watch, create, update, patch]
