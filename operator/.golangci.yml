version: "2"
linters:
  enable:
    - nolintlint
    - misspell
    - unconvert
    - unparam
    - nilerr
    - errorlint
    - copyloopvar
    - noctx
    - bodyclose
    - unused
    - bidichk
    - gocheckcompilerdirectives
    - usestdlibvars
    - goprintffuncname
    - nosprintfhostport
    - gomoddirectives
    - promlinter
  settings:
    staticcheck:
      checks: ["all", "-ST1000"]
    nolintlint:
      # Every suppression must name its rule and say why; unused directives fail.
      require-explanation: true
      require-specific: true
  exclusions:
    warn-unused: true
issues:
  # Default is 50/3, which can hide a real defect behind a cap.
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gofmt
    - goimports
