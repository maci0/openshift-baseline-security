version: "2"
linters:
  enable:
    - nolintlint
    - misspell
    - unconvert
    - unparam
    - nilerr
    - errorlint
    - copyloopvar
    - noctx
    - bodyclose
  settings:
    staticcheck:
      checks: ["all", "-ST1000"]
    nolintlint:
      # Every suppression must name its rule and say why; unused directives fail.
      require-explanation: true
      require-specific: true
formatters:
  enable:
    - gofmt
    - goimports
